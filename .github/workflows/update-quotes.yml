name: Update Twelve Data quotes

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-quotes.yml"
      - "scripts/update_quotes.py"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-market-quotes
  cancel-in-progress: false

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Twelve Data quotes
        run: python scripts/update_quotes.py
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

      - name: Commit and push the quote snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --cached --quiet; then
            echo "Quote snapshot is unchanged."
          else
            git commit -m "Update Twelve Data quote snapshots"
            git push origin main
          fi

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
